# nouveau is blacklisted (rd.driver.blacklist=nouveau) and the NVIDIA
# driver loads from the root filesystem after boot, so leave nouveau out
# of the initrd. It pulled in ~100 MB of nouveau GSP firmware per initrd,
# and with several kernels and snapshots the 1 GB ESP filled up:
# sdbootutil then skipped the new kernel's entry and booted an old kernel
# that has no NVIDIA module.
omit_drivers+=" nouveau "
