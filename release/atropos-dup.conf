# AtropOS updates with zypper dup only (transactional-update dup and the
# Discover backend). AtropOS packages come from a different vendor than
# openSUSE's. Without this, dup stops at a solver question whenever a
# package from one vendor replaces another vendor's package, in either
# direction, and the non-interactive updaters cancel the whole update.
# Repository priority still decides which package wins.
# Override in /etc/zypp/zypp.conf.d/ if needed.
[main]
solver.dupAllowVendorChange = true
