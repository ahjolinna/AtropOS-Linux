# Desktop-file overrides in /usr/share/atropos/applications.
# Flatpak's user environment generator runs after environment.d and
# keeps this directory. Do not assign XDG_DATA_DIRS without the
# previous value: that drops Flatpak exports.
XDG_DATA_DIRS=/usr/share/atropos:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
