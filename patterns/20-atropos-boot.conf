# The EFI system partition is mounted at /boot. Stock tukit does not
# bind that path, so inside a snapshot /boot is a directory on the root
# subvolume. sdbootutil is-installed is then false. The kernel scriptlet
# falls through to the legacy systemd-boot helper, that helper calls
# sdbootutil add-kernel, and the call fails because the partition is
# not mounted. zypper exits 107 and transactional-update deletes the
# snapshot. Bind the partition for the transaction. With
# TRANSACTIONAL_UPDATE set, the scriptlet leaves the boot menu to the
# snapper plugin, which registers the kernel after the snapshot is
# kept. Writes here are immediate and are not rolled back.
BINDDIRS[boot]="/boot"
