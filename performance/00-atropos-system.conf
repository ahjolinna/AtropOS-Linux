# Adapted for AtropOS from KDE Linux system.conf.d/00-kde-linux-default.conf

[Manager]
DefaultTimeoutStartSec=16s
DefaultTimeoutStopSec=8s
# Digital audio workstations lock memory. Leave that limit open.
DefaultLimitMEMLOCK=infinity
# systemd-oomd only watches cgroups with memory accounting.
DefaultMemoryAccounting=yes
