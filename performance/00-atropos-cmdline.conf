# sdbootutil appends /usr/kernel/cmdline.d after the first cmdline file it
# finds. A line in /usr/lib/kernel/cmdline would be hidden by /etc/kernel/cmdline.
# Lines starting with # are skipped.
#
# Silent boot from KDE Linux (quiet, splash, plymouth.ignore-serial-consoles,
# loglevel=3, vt.global_cursor_default=0, nowatchdog) plus the openSUSE
# console settings (splash=silent, systemd.show_status=auto,
# rd.udev.log_level=1). splash=silent is the openSUSE form of KDE's splash:
# Plymouth stays on the bgrt logo and does not print progress.
#
# Not copied from KDE Linux: nohz_full=all and rcu_nocbs (they need a
# housekeeping CPU), zswap.enabled=0 (this system uses zram),
# amdgpu.dcdebugmask, and systemd.hostname.
# kernel-longterm sets CONFIG_PSI_DEFAULT_DISABLED. Without psi=1 the
# kernel does not create /proc/pressure/memory, and systemd-oomd stays
# inactive because that start condition is unmet.
#
# kernel-longterm's first major LSM is AppArmor (CONFIG_DEFAULT_SECURITY_APPARMOR
# and apparmor before selinux in CONFIG_LSM). The policy packages do not
# change that. Aeon and MicroOS enable enforcing SELinux with
# security=selinux selinux=1. The mode is SELINUX=enforcing and
# SELINUXTYPE=targeted in /etc/selinux/config, written by
# selinux-policy-targeted. enforcing=0 would be permissive. selinux=0
# would turn it off. lsm= stays unset: CachyOS's list selects AppArmor,
# and KDE Linux does not ship an SELinux configuration.
quiet splash=silent plymouth.ignore-serial-consoles loglevel=3 vt.global_cursor_default=0 nowatchdog systemd.show_status=auto rd.udev.log_level=1 psi=1 security=selinux selinux=1
