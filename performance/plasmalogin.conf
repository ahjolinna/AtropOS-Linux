# AtropOS greeter. plasma-login-manager reads this file over
# /usr/lib/plasmalogin/defaults.conf. Drop-ins under plasmalogin.conf.d
# are ignored by releases that do not load that directory.
# org.kde.image is on the greeter wallpaper allow list. The path is the
# wallpaper package directory, which is world-readable.

[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/atropos-02
