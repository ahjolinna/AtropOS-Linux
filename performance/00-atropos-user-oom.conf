#
# Adapted from KDE Linux. Applied to user.slice so session cgroups are the
# kill candidates, at the 40% limit systemd-oomd.service(8) suggests for
# user sessions.

[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=40%
