# Adapted for AtropOS from KDE Linux
# mkosi.extra/usr/lib/systemd/zram-generator.conf.d/00-kde-linux-default.conf

[zram0]
# Allow up to $RAMSIZE memory to be compressed. With a 3:1 ratio that fills
# about one third of physical RAM with compressed pages.
# Do not go over 100%. Incompressible pages fill physical RAM first, and
# the machine freezes before zram itself is full.
zram-size = ram
# zstd level 1 is roughly 3:1. LZ4 is faster and compresses less.
compression-algorithm = zstd
