# tuned-ppd runs as tuned_ppd_t and cannot create its log while this
# directory is still var_log_t. Policy expects tuned_log_t.
# Z does nothing until the directory exists. tuned then creates it and
# the new directory inherits var_log_t from /var/log.
d /var/log/tuned 0755 root root -
Z /var/log/tuned 0755 root root -
