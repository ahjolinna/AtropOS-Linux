# This file has the same name as suse-module-tools'
# /usr/lib/modprobe.d/50-blacklist-rndis.conf, so it masks that file and
# rndis_host loads again when a phone is plugged in. Android USB
# tethering uses RNDIS, and so does SSH to the phone over USB.
#
# To blacklist rndis_host again, put this line here:
# blacklist rndis_host
