<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer the Adobe Source family for generic names</description>
  <!-- Loaded after the distribution preference lists. binding="same"
       keeps an explicit family request (Noto Sans, Roboto) on that family. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Source Sans 3</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Source Serif Pro</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Source Code Pro</family>
    </prefer>
  </alias>
</fontconfig>
