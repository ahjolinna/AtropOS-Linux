<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Plasma Login Manager shows the greeter when logind emits
       SecureAttentionKey. Atychia is the handler on AtropOS. The last
       matching receive rule wins, and this file sorts after
       org.freedesktop.login1.conf. The desktop user still receives it. -->
  <policy user="root">
    <deny receive_sender="org.freedesktop.login1"
          receive_interface="org.freedesktop.login1.Manager"
          receive_member="SecureAttentionKey"
          receive_type="signal"/>
  </policy>
</busconfig>
